---
- name: Get Satellite IP
  shell: "getent hosts satellite | awk '{print $1}'"
  register: satellite_ip

- name: Get Capsule IP
  shell: "getent hosts capsule | awk '{print $1}'"
  register: capsule_ip

- name: Add capsule and satellite entries to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: |
      10.0.2.2    capsule.lab.sandbox-{{ GUID }}-ocp4-cluster.svc.cluster.local capsule
      {{ satellite_ip.stdout }} {{ satellite_fqdn }} satellite
    state: present
  become: true
  
- name: Remove katello-ca-consumer packages
  command: yum remove -y katello-ca-consumer*
  become: true

- name: Install new katello-ca-consumer RPM
  command: >
    rpm -Uvh http://satellite/pub/katello-ca-consumer-latest.noarch.rpm
  become: true

- name: subscription-manager clean
  command: subscription-manager clean

- name: Register system to Satellite
  command: >
    subscription-manager register
    --force
    --username {{ satellite_admin_user }}
    --password {{ satellite_admin_password }}

- name: subscription-manager refresh
  command: subscription-manager refresh

- name: Enable Satellite Capsule repo
  command: subscription-manager repos --enable=satellite-capsule-6.17-for-rhel-9-x86_64-rpms

- name: Install satellite-capsule
  yum:
    name: satellite-capsule
    state: present

- name: Install chrony
  yum:
    name: chrony 
    state: present
  ignore_errors: true

- name: Get OAuth consumer key from Satellite
  command: >
    ssh {{ satellite_host }} "sudo grep oauth_consumer_key /etc/foreman/settings.yaml | cut -d ':' -f 3"
  register: oauth_key_raw

- name: Set oauth_consumer_key fact
  set_fact:
    oauth_consumer_key: "{{ oauth_key_raw.stdout | trim }}"

- name: Get OAuth consumer secret from Satellite
  command: >
    ssh {{ satellite_host }} "sudo grep oauth_consumer_secret /etc/foreman/settings.yaml | cut -d ':' -f 3"
  register: oauth_secret_raw

- name: Set oauth_consumer_secret fact
  set_fact:
    oauth_consumer_secret: "{{ oauth_secret_raw.stdout | trim }}"

- name: Show retrieved OAuth values
  debug:
    msg:
      - "OAuth Key: {{ oauth_consumer_key }}"
      - "OAuth Secret: {{ oauth_consumer_secret }}"

- name: Run satellite-installer for Capsule
  command: >
    satellite-installer --scenario capsule
    --certs-tar-file "/root/capsule.lab.sandbox-{{ GUID }}-ocp4-cluster.svc.cluster.local.tar"
    --foreman-proxy-register-in-foreman "true"
    --foreman-proxy-foreman-base-url "https://{{ satellite_fqdn }}"
    --foreman-proxy-trusted-hosts "{{ satellite_fqdn }}"
    --foreman-proxy-trusted-hosts "capsule.lab.sandbox-{{ GUID }}-ocp4-cluster.svc.cluster.local"
    --foreman-proxy-oauth-consumer-key "{{ oauth_consumer_key }}"
    --foreman-proxy-oauth-consumer-secret "{{ oauth_consumer_secret }}"
  become: true

- name: Read /etc/hosts from Satellite
  slurp:
    src: /etc/hosts
  register: hosts_file
  delegate_to: "satellite"
  run_once: true

- name: Write /etc/hosts on Capsule
  copy:
    content: "{{ hosts_file.content | b64decode }}"
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'

- name: Read /etc/hosts from Capsule
  slurp:
    src: /etc/hosts
  register: capsule_hosts

- name: Copy /etc/hosts to node1 and node2
  copy:
    content: "{{ capsule_hosts.content | b64decode }}"
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  delegate_to: "{{ item }}"
  loop:
    - node1
    - node2

- name: Replace only IP for line containing capsule
  replace:
    path: /etc/hosts
    regexp: '^\S+(\s+.*\scapsule(\s|$).*)$'
    replace: '10.0.2.2\1'

- name: Replace only IP for line containing satellite
  replace:
    path: /etc/hosts
    regexp: '^\S+(\s+.*\ssatellite(\s|$).*)$'
    replace: '10.0.2.2\1'
  delegate_to: satellite

- name: Set hostname on node1
  ansible.builtin.hostname:
    name: "node1.lab.sandbox-{{ GUID }}-base-infra.svc.cluster.local"
  delegate_to: node1
  become: true

- name: Set hostname on node2
  ansible.builtin.hostname:
    name: "node2.lab.sandbox-{{ GUID }}-base-infra.svc.cluster.local"
  delegate_to: node2
  become: true

- name: Remove katello-ca-consumer packages
  command: yum remove -y katello-ca-consumer*
  delegate_to: "{{ item }}"
  loop:
    - node1
    - node2
  become: true

- name: Install new katello-ca-consumer RPM
  command: >
    rpm -Uvh http://satellite/pub/katello-ca-consumer-latest.noarch.rpm
  delegate_to: "{{ item }}"
  loop:
    - node1
    - node2
  become: true

- name: subscription-manager clean
  command: subscription-manager clean
  delegate_to: "{{ item }}"
  loop:
    - node1
    - node2
  become: true
  
- name: Register system to Satellite
  command: >
    subscription-manager register
    --force
    --username {{ satellite_admin_user }}
    --password {{ satellite_admin_password }}
  delegate_to: "{{ item }}"
  loop:
    - node1
    - node2
  become: true

- name: subscription-manager refresh
  command: subscription-manager refresh
  delegate_to: "{{ item }}"
  loop:
    - node1
    - node2
  become: true
